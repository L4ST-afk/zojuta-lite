<rect x="290" y="291" width="99" height="38" rx="9" fill="#F2EFE7" stroke="#858072" stroke-width="1.0"/>
<text x="339" y="315" font-size="13.5" font-weight="400" fill="#33312C" text-anchor="middle">挑三到五条</text>
