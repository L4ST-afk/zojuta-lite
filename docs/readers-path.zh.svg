<rect x="290" y="169" width="72" height="38" rx="9" fill="#F2EFE7" stroke="#858072" stroke-width="1.0"/>
<text x="326" y="193" font-size="13.5" font-weight="400" fill="#33312C" text-anchor="middle">挑一卷</text>
