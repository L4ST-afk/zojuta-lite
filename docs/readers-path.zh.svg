<rect x="784" y="140" width="352" height="96" rx="10" fill="#FFFFFF" stroke="#858072" stroke-width="1.0"/>
<text x="800" y="191" font-size="13.5" font-weight="400" fill="#33312C" text-anchor="start">一行结论：违规／不违规／证据不足</text>
<rect x="44" y="262" width="204" height="96" rx="10" fill="#FFFFFF" stroke="#858072" stroke-width="1.0"/>
<text x="58" y="296" font-size="15.5" font-weight="600" fill="#2F4F43" text-anchor="start">人 · 评审</text>
<text x="58" y="320" font-size="12.5" font-weight="400" fill="#726C60" text-anchor="start">要给别人评</text>
