<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="700" viewBox="0 0 1180 700" font-family="'Noto Sans CJK SC','Source Han Sans SC','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" role="img">
<title>三种人，四条不同的路：自查、评审、agent 规则源、作者写规范，各自的起点、动作与产出</title>
<desc>四行对照图。左列是读者身份，中列是该身份要做的两三步动作，右列是这一步的产出。</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2F4F43"/></marker></defs>
<rect x="0" y="0" width="1180" height="700" rx="0" fill="#FAF8F3" stroke="#FAF8F3" stroke-width="0.0"/>
<text x="44" y="58" font-size="24.0" font-weight="600" fill="#33312C" text-anchor="start">三种人，四条不同的路</text>
<text x="44" y="84" font-size="13.5" font-weight="400" fill="#726C60" text-anchor="start">同一套 113 条判据；人分两种身份，再加 agent 与作者</text>
<text x="46" y="124" font-size="12.5" font-weight="400" fill="#6E6857" text-anchor="start">你是</text>
<text x="292" y="124" font-size="12.5" font-weight="400" fill="#6E6857" text-anchor="start">你的动作</text>
<text x="782" y="124" font-size="12.5" font-weight="400" fill="#6E6857" text-anchor="start">你拿到</text>
