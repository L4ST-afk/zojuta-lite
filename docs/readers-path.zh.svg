<rect x="290" y="413" width="99" height="38" rx="9" fill="#F2EFE7" stroke="#858072" stroke-width="1.0"/>
<text x="339" y="437" font-size="13.5" font-weight="400" fill="#33312C" text-anchor="middle">只改判据段</text>
