<rect x="396" y="169" width="72" height="38" rx="9" fill="#F2EFE7" stroke="#858072" stroke-width="1.0"/>
<text x="432" y="193" font-size="13.5" font-weight="400" fill="#33312C" text-anchor="middle">挑一条</text>
<path d="M476 188 H498" stroke="#2F4F43" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
<rect x="502" y="169" width="72" height="38" rx="9" fill="#F2EFE7" stroke="#858072" stroke-width="1.0"/>
<text x="538" y="193" font-size="13.5" font-weight="400" fill="#33312C" text-anchor="middle">答三档</text>
