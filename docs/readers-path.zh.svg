<text x="58" y="540" font-size="15.5" font-weight="600" fill="#2F4F43" text-anchor="start">作者 · 写规范</text>
<text x="58" y="564" font-size="12.5" font-weight="400" fill="#726C60" text-anchor="start">要写自己的规范</text>
<path d="M250 554 H286" stroke="#2F4F43" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
<rect x="290" y="535" width="72" height="38" rx="9" fill="#F2EFE7" stroke="#858072" stroke-width="1.0"/>
<text x="326" y="559" font-size="13.5" font-weight="400" fill="#33312C" text-anchor="middle">借问法</text>
<path d="M370 554 H392" stroke="#2F4F43" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
<rect x="396" y="535" width="86" height="38" rx="9" fill="#F2EFE7" stroke="#858072" stroke-width="1.0"/>
<text x="439" y="559" font-size="13.5" font-weight="400" fill="#33312C" text-anchor="middle">自推阈值</text>
<path d="M496 554 H772" stroke="#2F4F43" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
<rect x="784" y="506" width="352" height="96" rx="10" fill="#FFFFFF" stroke="#858072" stroke-width="1.0"/>
<text x="800" y="557" font-size="13.5" font-weight="400" fill="#33312C" text-anchor="start">你自己的 rubric 草稿</text>
<circle cx="54" cy="657" r="6" fill="none" stroke="#A8443C" stroke-width="1.6"/>
<path d="M50 653 L58 661" stroke="#A8443C" stroke-width="1.6" fill="none"/>
<text x="72" y="662" font-size="13.5" font-weight="400" fill="#726C60" text-anchor="start">谁都别从这里开始：把 113 条从头读完。</text>
</svg>