<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="700" viewBox="0 0 1180 700" font-family="'Noto Sans CJK SC','Source Han Sans SC','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2F4F43"/></marker></defs>
<rect x="0" y="0" width="1180" height="700" rx="0" fill="#FAF8F3" stroke="#FAF8F3" stroke-width="0"/>
<text x="44" y="58" font-size="24" font-weight="600" fill="#33312C" text-anchor="start">Three kinds of reader, four different paths</text>
<text x="44" y="84" font-size="13" font-weight="400" fill="#7A7469" text-anchor="start">One set of 113 entries: a person in two roles, plus an agent and an author</text>
<text x="46" y="124" font-size="11" font-weight="400" fill="#948D80" text-anchor="start">You are</text>
<text x="292" y="124" font-size="11" font-weight="400" fill="#948D80" text-anchor="start">What you do</text>
<text x="782" y="124" font-size="11" font-weight="400" fill="#948D80" text-anchor="start">What you get</text>
<rect x="44" y="140" width="204" height="96" rx="10" fill="#FFFFFF" stroke="#C9C2B4" stroke-width="1.2"/>
<text x="58" y="174" font-size="15" font-weight="600" fill="#2F4F43" text-anchor="start">Person · self-check</text>
<text x="58" y="198" font-size="12" font-weight="400" fill="#7A7469" text-anchor="start">one thing in hand</text>
<path d="M250 188 H286" stroke="#2F4F43" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
<rect x="290" y="169" width="91" height="38" rx="9" fill="#F2EFE7" stroke="#D6CFC0" stroke-width="1"/>
<text x="335" y="193" font-size="13" font-weight="400" fill="#33312C" text-anchor="middle">1 volume</text>
<path d="M389 188 H403" stroke="#2F4F43" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
<rect x="411" y="169" width="83" height="38" rx="9" fill="#F2EFE7" stroke="#D6CFC0" stroke-width="1"/>
<text x="452" y="193" font-size="13" font-weight="400" fill="#33312C" text-anchor="middle">1 entry</text>
<path d="M502 188 H516" stroke="#2F4F43" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
<rect x="524" y="169" width="91" height="38" rx="9" fill="#F2EFE7" stroke="#D6CFC0" stroke-width="1"/>
<text x="569" y="193" font-size="13" font-weight="400" fill="#33312C" text-anchor="middle">3 grades</text>
<path d="M629 188 H772" stroke="#2F4F43" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
<rect x="784" y="156" width="352" height="64" rx="10" fill="#FFFFFF" stroke="#C9C2B4" stroke-width="1.2"/>
<text x="800" y="191" font-size="13" font-weight="400" fill="#33312C" text-anchor="start">One line: violation / no violation / not enough</text>
<rect x="44" y="262" width="204" height="96" rx="10" fill="#FFFFFF" stroke="#C9C2B4" stroke-width="1.2"/>
<text x="58" y="296" font-size="15" font-weight="600" fill="#2F4F43" text-anchor="start">Person · reviewer</text>
<text x="58" y="320" font-size="12" font-weight="400" fill="#7A7469" text-anchor="start">reviewing others</text>
<path d="M250 310 H286" stroke="#2F4F43" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
<rect x="290" y="291" width="150" height="38" rx="9" fill="#F2EFE7" stroke="#D6CFC0" stroke-width="1"/>
<text x="365" y="315" font-size="13" font-weight="400" fill="#33312C" text-anchor="middle">pick 3-5 entries</text>
<path d="M448 310 H462" stroke="#2F4F43" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
<rect x="470" y="291" width="150" height="38" rx="9" fill="#F2EFE7" stroke="#D6CFC0" stroke-width="1"/>
<text x="545" y="315" font-size="13" font-weight="400" fill="#33312C" text-anchor="middle">make a checklist</text>
<path d="M634 310 H772" stroke="#2F4F43" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
<rect x="784" y="278" width="352" height="64" rx="10" fill="#FFFFFF" stroke="#C9C2B4" stroke-width="1.2"/>
<text x="800" y="313" font-size="13" font-weight="400" fill="#33312C" text-anchor="start">A checklist you can paste into the review</text>
<rect x="44" y="384" width="204" height="96" rx="10" fill="#FFFFFF" stroke="#C9C2B4" stroke-width="1.2"/>
<text x="58" y="418" font-size="15" font-weight="600" fill="#2F4F43" text-anchor="start">Agent · rule source</text>
<text x="58" y="442" font-size="12" font-weight="400" fill="#7A7469" text-anchor="start">make the model hold</text>
<path d="M250 432 H286" stroke="#2F4F43" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
<rect x="290" y="413" width="135" height="38" rx="9" fill="#F2EFE7" stroke="#D6CFC0" stroke-width="1"/>
<text x="357" y="437" font-size="13" font-weight="400" fill="#33312C" text-anchor="middle">criterion only</text>
<path d="M433 432 H447" stroke="#2F4F43" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
<rect x="455" y="413" width="128" height="38" rx="9" fill="#F2EFE7" stroke="#D6CFC0" stroke-width="1"/>
<text x="519" y="437" font-size="13" font-weight="400" fill="#33312C" text-anchor="middle">pass 3 checks</text>
<path d="M597 432 H772" stroke="#2F4F43" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
<rect x="784" y="400" width="352" height="64" rx="10" fill="#FFFFFF" stroke="#C9C2B4" stroke-width="1.2"/>
<text x="800" y="435" font-size="13" font-weight="400" fill="#33312C" text-anchor="start">One rule that can be judged true or false</text>
<rect x="44" y="506" width="204" height="96" rx="10" fill="#FFFFFF" stroke="#C9C2B4" stroke-width="1.2"/>
<text x="58" y="540" font-size="15" font-weight="600" fill="#2F4F43" text-anchor="start">Author</text>
<text x="58" y="564" font-size="12" font-weight="400" fill="#7A7469" text-anchor="start">writing your own spec</text>
<path d="M250 554 H286" stroke="#2F4F43" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
<rect x="290" y="535" width="150" height="38" rx="9" fill="#F2EFE7" stroke="#D6CFC0" stroke-width="1"/>
<text x="365" y="559" font-size="13" font-weight="400" fill="#33312C" text-anchor="middle">borrow questions</text>
<path d="M448 554 H462" stroke="#2F4F43" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
<rect x="470" y="535" width="158" height="38" rx="9" fill="#F2EFE7" stroke="#D6CFC0" stroke-width="1"/>
<text x="549" y="559" font-size="13" font-weight="400" fill="#33312C" text-anchor="middle">derive thresholds</text>
<path d="M642 554 H772" stroke="#2F4F43" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
<rect x="784" y="522" width="352" height="64" rx="10" fill="#FFFFFF" stroke="#C9C2B4" stroke-width="1.2"/>
<text x="800" y="557" font-size="13" font-weight="400" fill="#33312C" text-anchor="start">Your own rubric draft</text>
<text x="46" y="662" font-size="15" font-weight="600" fill="#A8443C" text-anchor="start">✕</text>
<text x="66" y="662" font-size="13" font-weight="400" fill="#7A7469" text-anchor="start">Nobody starts here: reading all 113 entries front to back.</text>
</svg>