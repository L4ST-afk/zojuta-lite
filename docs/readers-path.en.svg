<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="700" viewBox="0 0 1180 700" font-family="'Noto Sans CJK SC','Source Han Sans SC','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" role="img">
<title>Three kinds of reader, four different paths: self-check, review, agent rule source, author&#x27;s own standard</title>
<desc>Four rows. Left column is the reader, middle column the two or three moves, right column the output of that move.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2F4F43"/></marker></defs>
<rect x="0" y="0" width="1180" height="700" rx="0" fill="#FAF8F3" stroke="#FAF8F3" stroke-width="0.0"/>
<text x="44" y="58" font-size="24.0" font-weight="600" fill="#33312C" text-anchor="start">Three kinds of reader, four different paths</text>
<text x="44" y="84" font-size="13.5" font-weight="400" fill="#726C60" text-anchor="start">One set of 113 entries: a person in two roles, plus an agent and an author</text>
<text x="46" y="124" font-size="12.5" font-weight="400" fill="#6E6857" text-anchor="start">You are</text>
<text x="292" y="124" font-size="12.5" font-weight="400" fill="#6E6857" text-anchor="start">What you do</text>
<text x="782" y="124" font-size="12.5" font-weight="400" fill="#6E6857" text-anchor="start">What you get</text>
<rect x="44" y="140" width="204" height="96" rx="10" fill="#FFFFFF" stroke="#858072" stroke-width="1.0"/>
<text x="58" y="174" font-size="15.5" font-weight="600" fill="#2F4F43" text-anchor="start">Person · self-check</text>
<text x="58" y="198" font-size="12.5" font-weight="400" fill="#726C60" text-anchor="start">one thing in hand</text>
<path d="M250 188 H286" stroke="#2F4F43" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
<rect x="290" y="169" width="91" height="38" rx="9" fill="#F2EFE7" stroke="#858072" stroke-width="1.0"/>
<text x="335" y="193" font-size="13.5" font-weight="400" fill="#33312C" text-anchor="middle">1 volume</text>
<path d="M389 188 H411" stroke="#2F4F43" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
<rect x="415" y="169" width="83" height="38" rx="9" fill="#F2EFE7" stroke="#858072" stroke-width="1.0"/>
<text x="456" y="193" font-size="13.5" font-weight="400" fill="#33312C" text-anchor="middle">1 entry</text>
<path d="M506 188 H528" stroke="#2F4F43" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
<rect x="532" y="169" width="91" height="38" rx="9" fill="#F2EFE7" stroke="#858072" stroke-width="1.0"/>
<text x="577" y="193" font-size="13.5" font-weight="400" fill="#33312C" text-anchor="middle">3 grades</text>
<path d="M637 188 H772" stroke="#2F4F43" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
<rect x="784" y="140" width="352" height="96" rx="10" fill="#FFFFFF" stroke="#858072" stroke-width="1.0"/>
<text x="800" y="191" font-size="13.5" font-weight="400" fill="#33312C" text-anchor="start">One line: violation / no violation / not enough</text>
<rect x="44" y="262" width="204" height="96" rx="10" fill="#FFFFFF" stroke="#858072" stroke-width="1.0"/>
<text x="58" y="296" font-size="15.5" font-weight="600" fill="#2F4F43" text-anchor="start">Person · reviewer</text>
<text x="58" y="320" font-size="12.5" font-weight="400" fill="#726C60" text-anchor="start">reviewing others</text>
<path d="M250 310 H286" stroke="#2F4F43" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
<rect x="290" y="291" width="150" height="38" rx="9" fill="#F2EFE7" stroke="#858072" stroke-width="1.0"/>
<text x="365" y="315" font-size="13.5" font-weight="400" fill="#33312C" text-anchor="middle">pick 3-5 entries</text>
<path d="M448 310 H470" stroke="#2F4F43" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
<rect x="474" y="291" width="150" height="38" rx="9" fill="#F2EFE7" stroke="#858072" stroke-width="1.0"/>
<text x="549" y="315" font-size="13.5" font-weight="400" fill="#33312C" text-anchor="middle">make a checklist</text>
<path d="M638 310 H772" stroke="#2F4F43" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
<rect x="784" y="262" width="352" height="96" rx="10" fill="#FFFFFF" stroke="#858072" stroke-width="1.0"/>
<text x="800" y="313" font-size="13.5" font-weight="400" fill="#33312C" text-anchor="start">A checklist you can paste into the review</text>
<rect x="44" y="384" width="204" height="96" rx="10" fill="#FFFFFF" stroke="#858072" stroke-width="1.0"/>
<text x="58" y="418" font-size="15.5" font-weight="600" fill="#2F4F43" text-anchor="start">Agent · rule source</text>
<text x="58" y="442" font-size="12.5" font-weight="400" fill="#726C60" text-anchor="start">make the model hold</text>
<path d="M250 432 H286" stroke="#2F4F43" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
<rect x="290" y="413" width="135" height="38" rx="9" fill="#F2EFE7" stroke="#858072" stroke-width="1.0"/>
<text x="357" y="437" font-size="13.5" font-weight="400" fill="#33312C" text-anchor="middle">criterion only</text>
<path d="M433 432 H455" stroke="#2F4F43" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
<rect x="459" y="413" width="128" height="38" rx="9" fill="#F2EFE7" stroke="#858072" stroke-width="1.0"/>
<text x="523" y="437" font-size="13.5" font-weight="400" fill="#33312C" text-anchor="middle">pass 3 checks</text>
<path d="M601 432 H772" stroke="#2F4F43" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
<rect x="784" y="384" width="352" height="96" rx="10" fill="#FFFFFF" stroke="#858072" stroke-width="1.0"/>
<text x="800" y="435" font-size="13.5" font-weight="400" fill="#33312C" text-anchor="start">One rule that can be judged true or false</text>
<rect x="44" y="506" width="204" height="96" rx="10" fill="#FFFFFF" stroke="#858072" stroke-width="1.0"/>
<text x="58" y="540" font-size="15.5" font-weight="600" fill="#2F4F43" text-anchor="start">Author</text>
<text x="58" y="564" font-size="12.5" font-weight="400" fill="#726C60" text-anchor="start">writing your own spec</text>
<path d="M250 554 H286" stroke="#2F4F43" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
<rect x="290" y="535" width="150" height="38" rx="9" fill="#F2EFE7" stroke="#858072" stroke-width="1.0"/>
<text x="365" y="559" font-size="13.5" font-weight="400" fill="#33312C" text-anchor="middle">borrow questions</text>
<path d="M448 554 H470" stroke="#2F4F43" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
<rect x="474" y="535" width="158" height="38" rx="9" fill="#F2EFE7" stroke="#858072" stroke-width="1.0"/>
<text x="553" y="559" font-size="13.5" font-weight="400" fill="#33312C" text-anchor="middle">derive thresholds</text>
<path d="M646 554 H772" stroke="#2F4F43" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
<rect x="784" y="506" width="352" height="96" rx="10" fill="#FFFFFF" stroke="#858072" stroke-width="1.0"/>
<text x="800" y="557" font-size="13.5" font-weight="400" fill="#33312C" text-anchor="start">Your own rubric draft</text>
<circle cx="54" cy="657" r="6" fill="none" stroke="#A8443C" stroke-width="1.6"/>
<path d="M50 653 L58 661" stroke="#A8443C" stroke-width="1.6" fill="none"/>
<text x="72" y="662" font-size="13.5" font-weight="400" fill="#726C60" text-anchor="start">Nobody starts here: reading all 113 entries front to back.</text>
</svg>